[project]
name = "aws-serverless-adk-cloudwatch-trace-evaluation"
version = "0.1.0"
description = "Agent Kernel Google ADK agent on AWS Lambda whose CloudWatch traces are graded by Opik judges and stored in DynamoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Per-Lambda dependency sets; deploy.sh installs each package with `uv export --extra <name>`.
# The request handler serves /eval and /check and runs the grading, so it carries Opik and reads the spans
# back through CloudWatch Logs Insights; only the agent runner needs Google ADK (with LiteLLM for the OpenAI model).
request_handler = [
    "agentkernel[aws,redis,cloudwatch,opik]>=0.9.5",
    "boto3>=1.40.0",
]
agent_runner = [
    "agentkernel[aws,adk,redis,cloudwatch]>=0.9.5",
]
response_handler = [
    "agentkernel[aws,redis]>=0.9.5",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.9.5",
    "httpx>=0.27.0",
    "black==26.5.1",
    "isort>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Show the live test's progress logs as it runs
log_cli = true
log_cli_level = "INFO"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]
