execution:
  mode: "realtime"
  realtime:
    # Audio is sent this far ahead of playback. The default (50 ms) suits a light server; this one
    # also runs the Coder, the Reviewer, the sandbox and the board, and a stall longer than the lead
    # is heard as a gap. A barge-in still stops the agent at once (the queued audio is dropped).
    playback_lead_ms: 300

# The background Coder and Reviewer write and test code in a sandbox; the voice agents never get the
# sandbox tools or its prompt section (`agents`). Both background agents work in the call's `-dev`
# session, so they share one workspace (scope `per_session`, the default).
sandbox:
  enabled: true
  agents: [coder, reviewer]
  default_profile: docker
  profiles:
    # A container per call: isolated, with /workspace as the project root. Needs a running Docker daemon.
    docker:
      type: docker
      idle_timeout: 3600
      policy:
        timeout: 300 # pip installs and test runs can take a while
      docker:
        image: python:3.12-slim
    # No isolation: the generated code runs on this machine, in a temp folder. For local development only;
    # select it with AK_SANDBOX__DEFAULT_PROFILE=local.
    local:
      type: local_subprocess
      idle_timeout: 3600
      policy:
        timeout: 300
      local_subprocess: {}
  broker:
    flavor: thread

# The client's page and its token route are served at the root (GET /, GET /token) instead of /custom/.
# They ask nobody who is calling (a room token, the project's files, the approval button, file uploads),
# so the server listens on this machine only. Set AK_API__HOST=0.0.0.0 to open it to your network, and
# put authentication in front of it first.
api:
  host: "127.0.0.1"
  custom_router_prefix: ""
