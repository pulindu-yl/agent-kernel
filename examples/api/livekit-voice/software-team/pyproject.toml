[project]
name = "livekit-voice-software-team-example"
version = "0.1.0"
description = "Agent Kernel LiveKit Realtime Voice Software Team Showcase (Google ADK: Gemini Live voices, background agents through LiteLLM)"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[livekit,adk,api,sandbox-docker]>=0.9.5"
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.9.5",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120
# Projects the team delivers, generated by running the example.
extend_skip = ["output"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "/output/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
